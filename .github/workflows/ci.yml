name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes. Pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a push to a base branch, skip the jobs below when the merged PR already passed them on exactly this code
  # (same git tree). Any doubt runs them. See scripts/ci-already-verified.sh (vendored from agent-workflow).
  verified:
    name: Already verified on PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci-already-verified.sh ci.yml "check"

  # Lint, typecheck, unit tests and production build. Runs on every ready PR and on every push
  # to main. Draft PRs skip CI until they are marked ready for review. Playwright lives in e2e.yml.
  check:
    needs: verified
    if: ${{ !cancelled() && needs.verified.outputs.skip != 'true' && (github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buku
          POSTGRES_PASSWORD: buku
          POSTGRES_DB: buku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buku:buku@localhost:5432/buku
      TEST_DATABASE_URL: postgresql://buku:buku@localhost:5432/buku_test
      DEMO_MODE: "true"
      EVIDENCE_ENABLED: "true"
      APP_URL: http://localhost:3200
      AI_API_KEY: ""
      AI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      # Vendored workflow skills (.agents/skills) must match their lock; offline, no deps.
      - name: Agent workflow drift check
        run: bash scripts/sync-agent-workflow.sh --check
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: psql postgresql://buku:buku@localhost:5432/buku -c "CREATE DATABASE buku_test"
      - run: npx prisma migrate deploy
      # Read-only drift check on the fresh database: proves the production build's check gives no false positive, and fails a
      # schema.prisma change that has no migration (ADR 0019, amended).
      - name: Migration drift check
        run: npm run db:drift
      - name: Lint & typecheck
        run: npm run lint && npm run typecheck
      - name: Unit + DB + ground-truth tests
        run: npm test
      # Without NEXT_PUBLIC_SUPABASE_* the auth client is simply unconfigured (lib/supabase/env.ts),
      # which is enough to catch compile, route and server/client boundary errors.
      - name: Build
        run: npm run build
