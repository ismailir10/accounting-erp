name: E2E
# The heavy job: local Supabase stack, production build and Playwright. Runs on pushes to main,
# on manual dispatch, or on a ready PR that carries the `e2e` label.
#
# Separate from ci.yml so that `labeled` can be a trigger: adding the `e2e` label to an open PR
# starts this run straight away, without re-running lint/tests. Other labels start a run whose
# job is skipped, which bills no minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes. Pushes to main always finish. A run started
# by a label other than `e2e` gets a group of its own, so it cannot cancel a real e2e run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a push to a base branch, skip the jobs below when the merged PR already passed them on exactly this code
  # (same git tree). Any doubt runs them. See scripts/ci-already-verified.sh (vendored from agent-workflow).
  verified:
    name: Already verified on PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci-already-verified.sh e2e.yml "e2e"

  e2e:
    needs: verified
    # On a `labeled` event, only the `e2e` label itself counts, so tagging an already-labelled PR
    # with something else does not re-run the suite.
    if: >-
      !cancelled() && needs.verified.outputs.skip != 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft != true &&
        contains(github.event.pull_request.labels.*.name, 'e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buku
          POSTGRES_PASSWORD: buku
          POSTGRES_DB: buku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buku:buku@localhost:5432/buku
      TEST_DATABASE_URL: postgresql://buku:buku@localhost:5432/buku_test
      DEMO_MODE: "true"
      EVIDENCE_ENABLED: "true"
      APP_URL: http://localhost:3200
      AI_API_KEY: ""
      AI_MODEL: ""
      # Test-only value (production sets its own): Unggah keeps PDF passwords encrypted with it (ADR 0018).
      SETTINGS_SECRET: e2e-only-settings-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      # Auth for the e2e walk: a throwaway local Supabase stack (Auth + gateway + its own Postgres on :54322).
      # NEXT_PUBLIC_* are inlined at build time, so the stack must be up before `next build`. Mailpit stays on:
      # e2e/auth-links and e2e/trial-signup read the invitation mails it captures.
      - uses: supabase/setup-cli@v1
        with: { version: 2.118.0 } # pinned: resolving "latest" calls the GitHub API, which rate-limits CI
      - name: Supabase Auth (local stack)
        run: |
          supabase start -x realtime,storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          . "$RUNNER_TEMP/supabase.env"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Seed + verify books (layer 2)
        run: npm run demo:reset && npm run verify:books
      - name: Playwright investor walk (layer 3)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Private-mode workspace parity (synthetic data)
        run: npm run test:e2e
        env:
          EVIDENCE_ENABLED: "true"
          DEMO_MODE: "false"
          AI_API_KEY: ""
          AI_MODEL: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
